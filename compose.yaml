services:
  fluxer-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}"
      Fluxer__ApiBaseUrl: "${FLUXER_API_BASE_URL:?Set FLUXER_API_BASE_URL in .env}"
      Fluxer__ClientId: "${FLUXER_CLIENT_ID:?Set FLUXER_CLIENT_ID in .env}"
      Fluxer__ClientSecret: "${FLUXER_CLIENT_SECRET:?Set FLUXER_CLIENT_SECRET in .env}"
      Fluxer__AdminApiKey: "${FLUXER_ADMIN_API_KEY:?Set FLUXER_ADMIN_API_KEY in .env}"
      Fluxer__PublicUrl: "${FLUXER_PUBLIC_URL:?Set FLUXER_PUBLIC_URL in .env}"
      Fluxer__ClientRedirectUri: "${FLUXER_CLIENT_REDIRECT_URI:?Set FLUXER_CLIENT_REDIRECT_URI in .env}"
