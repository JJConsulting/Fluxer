name: CI/CD

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore JJConsulting.Fluxer.slnx
      - run: dotnet build JJConsulting.Fluxer.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test JJConsulting.Fluxer.slnx -c Release --no-build
      - name: Read project version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/JJConsulting.Fluxer.Client/JJConsulting.Fluxer.Client.csproj -p:Configuration=Release -getProperty:Version)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: dotnet pack src/JJConsulting.Fluxer.Client -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: Build Docker image
        run: docker build --tag fluxer-mcp:ci .

  nuget:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish client
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  docker:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxer-mcp
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
